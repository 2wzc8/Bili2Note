[project]
name = "bili2note"
version = "0.1.0"
description = "Bilibili 视频 → AI 结构化讲义（MVP：官方字幕 → LLM 提纯 → Markdown）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
]

[project.scripts]
bili2note = "bili2note.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
